<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner - Stock PCM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #1a1a1a; color: white; font-family: 'Mitr', sans-serif; }
        #reader { width: 100%; border-radius: 20px; overflow: hidden; border: 2px solid #333; }
        .scanner-container { max-width: 500px; margin: auto; padding-top: 50px; }
        /* ตกแต่งกรอบสแกน */
        #reader__scan_region { background: white !important; }
    </style>
</head>
<body>
    <div class="container scanner-container">
        <div class="text-center mb-4">
            <h2 class="fw-medium"><i class="fas fa-qrcode text-primary me-2"></i>QR Scanner</h2>
            <p class="text-secondary">วางรหัสสินค้าให้อยู่ในกรอบเพื่อสแกน</p>
        </div>

        <div id="reader"></div>

        <div class="d-grid gap-2 mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-outline-light rounded-pill py-2">
                <i class="fas fa-times me-2"></i>ยกเลิกและกลับหน้าหลัก
            </a>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // เมื่อสแกนติด ให้พาไปยัง Route ที่เราเพิ่งสร้าง
            window.location.href = `/scan/${decodedText}`;
            html5QrcodeScanner.clear(); // ปิดกล้อง
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 15, // ความเร็วเฟรม
                qrbox: {width: 250, height: 250}, // ขนาดกรอบสแกน
                aspectRatio: 1.0 
            }
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
