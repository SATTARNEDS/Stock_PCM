<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองรถ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Mitr", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(85, 110, 160, 0.2), transparent 35%),
                radial-gradient(circle at 90% 20%, rgba(102, 126, 234, 0.16), transparent 34%),
                linear-gradient(145deg, #f2f6ff 0%, #f7f9ff 55%, #f5f8ff 100%);
        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(88, 109, 150, 0.16);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(24, 42, 75, 0.12);
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="panel p-4 p-lg-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <div class="small text-muted">{{ user['location'] }} | {{ user['department'] }}</div>
                    <h1 class="h3 mb-0 fw-medium"><i class="fas fa-car-side me-2"></i>ระบบจองรถ</h1>
                </div>
                <a href="{{ url_for('user_services', emp_id=user['emp_id']) }}" class="btn btn-outline-dark rounded-pill px-4">
                    <i class="fas fa-arrow-left me-1"></i> กลับหน้าเลือกเมนู
                </a>
            </div>

            <div class="alert alert-info border-0 rounded-4 mb-0">
                ระบบอยู่ในระหว่างการพัฒนา
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ─── Floating Support Chat Widget ─── -->
    <style>
        .sup-fab { position:fixed; bottom:28px; right:28px; width:56px; height:56px; border-radius:50%; border:none; background:linear-gradient(135deg,#005fcc,#00a1c9); color:#fff; font-size:22px; cursor:pointer; box-shadow:0 4px 18px rgba(0,95,204,.38); z-index:2000; display:flex; align-items:center; justify-content:center; transition:transform .2s,box-shadow .2s; animation:floatSupportFab 2.6s ease-in-out infinite; }
        .sup-fab:hover { animation-play-state:paused; transform:scale(1.08) translateY(-1px); box-shadow:0 6px 22px rgba(0,95,204,.5); }
        .sup-fab.has-unread { animation-duration:1.05s; box-shadow:0 8px 24px rgba(217,4,41,.38); }
        @keyframes floatSupportFab { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
        .sup-fab .sup-badge { position:absolute; top:-4px; right:-4px; background:#e53935; color:#fff; font-size:10px; font-weight:700; min-width:18px; height:18px; border-radius:9px; padding:0 4px; line-height:18px; text-align:center; display:none; animation:supBlink 1.2s infinite; }
        @keyframes supBlink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
        .sup-panel { position:fixed; bottom:96px; right:28px; width:340px; max-height:480px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.18); z-index:2001; display:none; flex-direction:column; overflow:hidden; font-family:"Mitr",sans-serif; }
        .sup-panel.open { display:flex; }
        .sup-panel-head { background:linear-gradient(135deg,#005fcc,#00a1c9); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; }
        .sup-panel-head .title { flex:1; font-size:14px; font-weight:500; }
        .sup-panel-head .subtitle { font-size:11px; opacity:.8; }
        .sup-panel-head button { background:transparent; border:none; color:#fff; font-size:18px; line-height:1; cursor:pointer; padding:0; }
        .sup-chat-box { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#f5f8ff; }
        .sup-bubble { max-width:82%; padding:8px 12px; border-radius:14px; font-size:13px; line-height:1.5; word-break:break-word; }
        .sup-bubble.user { align-self:flex-end; background:#005fcc; color:#fff; border-bottom-right-radius:4px; }
        .sup-bubble.admin { align-self:flex-start; background:#fff; color:#1f2d3d; border-bottom-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .sup-bubble .sup-meta { font-size:10px; margin-top:3px; opacity:.65; }
        .sup-chat-empty { text-align:center; color:#999; font-size:12px; padding:20px 10px; }
        .sup-input-row { display:flex; gap:8px; padding:10px 12px; border-top:1px solid #e5eaf2; background:#fff; }
        .sup-input-row textarea { flex:1; border:1px solid #d0dce8; border-radius:10px; padding:7px 10px; font-size:13px; font-family:inherit; resize:none; outline:none; max-height:80px; }
        .sup-input-row button { background:linear-gradient(135deg,#005fcc,#00a1c9); border:none; border-radius:10px; color:#fff; padding:7px 14px; font-size:16px; cursor:pointer; }
        .sup-input-row button:disabled { opacity:.4; cursor:not-allowed; }
    </style>
    <button class="sup-fab" id="supFab" onclick="toggleSupportChat()" title="แจ้งปัญหาการใช้งาน" aria-label="Support Chat">
        <i class="fa fa-comments"></i><span class="sup-badge" id="supBadge">0</span>
    </button>
    <div class="sup-panel" id="supPanel">
        <div class="sup-panel-head">
            <div><div class="title"><i class="fa fa-headset"></i> ศูนย์ช่วยเหลือ PCM</div><div class="subtitle">แจ้งปัญหาการใช้งาน</div></div>
            <button onclick="toggleSupportChat()" aria-label="ปิด">✕</button>
        </div>
        <div class="sup-chat-box" id="supChatBox">
            <div class="sup-chat-empty" id="supChatEmpty">ยังไม่มีข้อความ<br>พิมพ์เพื่อแจ้งปัญหาหรือสอบถาม</div>
        </div>
        <div class="sup-input-row">
            <textarea id="supInput" rows="1" placeholder="พิมพ์ข้อความ..." onkeydown="supInputKeydown(event)"></textarea>
            <button id="supSendBtn" onclick="sendSupportMsg()" title="ส่ง"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>
    <script>
    (function(){
        const supCsrf="{{csrf_token()}}";
        const SUP_SINCE_KEY='sup_since_{{session["user_id"]|default("")}}';
        let supSinceId=parseInt(localStorage.getItem(SUP_SINCE_KEY)||'0',10);
        let supPanelOpen=false,supPresenceTimer=null,supPollTimer=null,supSending=false;
        function toggleSupportChat(){supPanelOpen=!supPanelOpen;document.getElementById('supPanel').classList.toggle('open',supPanelOpen);if(supPanelOpen){loadSupportChat();startSupPresence();document.getElementById('supInput').focus();}else{stopSupPresence();fetch('/support/presence',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':supCsrf},body:JSON.stringify({action:'clear',csrf_token:supCsrf})}).catch(()=>{});}}
        window.toggleSupportChat=toggleSupportChat;
        function startSupPresence(){pingSupPresence();if(!supPresenceTimer)supPresenceTimer=setInterval(pingSupPresence,20000);}
        function stopSupPresence(){clearInterval(supPresenceTimer);supPresenceTimer=null;}
        function pingSupPresence(){fetch('/support/presence',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':supCsrf},body:JSON.stringify({action:'mark',csrf_token:supCsrf})}).catch(()=>{});}
        function loadSupportChat(){fetch('/support/chat?since_id=0',{headers:{'X-CSRF-Token':supCsrf}}).then(r=>r.json()).then(data=>{if(!data.messages)return;const box=document.getElementById('supChatBox');box.innerHTML='';if(data.messages.length===0){box.innerHTML='<div class="sup-chat-empty">ยังไม่มีข้อความ<br>พิมพ์เพื่อแจ้งปัญหาหรือสอบถาม</div>';}else{data.messages.forEach(m=>appendSupMsg(m,false));supSinceId=data.messages[data.messages.length-1].id;localStorage.setItem(SUP_SINCE_KEY,supSinceId);}scrollSupChat();setSupUnread(0);startSupPolling();}).catch(()=>{});}
        function startSupPolling(){clearInterval(supPollTimer);supPollTimer=setInterval(()=>{if(!supPanelOpen){pollSupNotify();return;}fetch('/support/chat?since_id='+supSinceId,{headers:{'X-CSRF-Token':supCsrf}}).then(r=>r.json()).then(data=>{if(!data.messages||!data.messages.length)return;data.messages.forEach(m=>appendSupMsg(m,true));supSinceId=data.messages[data.messages.length-1].id;localStorage.setItem(SUP_SINCE_KEY,supSinceId);scrollSupChat();}).catch(()=>{});},12000);}
        function pollSupNotify(){fetch('/support/notifications',{headers:{'X-CSRF-Token':supCsrf}}).then(r=>r.json()).then(data=>{setSupUnread(data.unread||0);}).catch(()=>{});}
        function appendSupMsg(m,isNew){const empty=document.getElementById('supChatEmpty');if(empty)empty.remove();const box=document.getElementById('supChatBox');if(m&&m.id&&box.querySelector('[data-msg-id="'+String(m.id)+'"]'))return;const div=document.createElement('div');div.className='sup-bubble '+m.sender_type;if(m&&m.id)div.setAttribute('data-msg-id',String(m.id));div.innerHTML=`<div>${escSupHtml(m.message)}</div><div class="sup-meta">${m.sender_type==='admin'?'🛡️ '+escSupHtml(m.sender_name)+' · ':''}${m.created_at}</div>`;box.appendChild(div);if(isNew&&m.sender_type==='admin')scrollSupChat();}
        function scrollSupChat(){const box=document.getElementById('supChatBox');box.scrollTop=box.scrollHeight;}
        function setSupUnread(n){const badge=document.getElementById('supBadge');const fab=document.getElementById('supFab');if(n>0){badge.textContent=n;badge.style.display='block';if(fab)fab.classList.add('has-unread');}else{badge.style.display='none';if(fab)fab.classList.remove('has-unread');}}
        function sendSupportMsg(){if(supSending)return;const inp=document.getElementById('supInput');const msg=inp.value.trim();if(!msg)return;supSending=true;document.getElementById('supSendBtn').disabled=true;fetch('/support/chat',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':supCsrf},body:JSON.stringify({message:msg,csrf_token:supCsrf})}).then(r=>r.json()).then(data=>{if(data.ok){inp.value='';if(data.message){appendSupMsg(data.message,false);supSinceId=Math.max(supSinceId,Number(data.message.id||0));localStorage.setItem(SUP_SINCE_KEY,supSinceId);scrollSupChat();}}}).catch(()=>{}).finally(()=>{supSending=false;document.getElementById('supSendBtn').disabled=false;});}
        window.sendSupportMsg=sendSupportMsg;
        function supInputKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendSupportMsg();}}
        window.supInputKeydown=supInputKeydown;
        function escSupHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
        document.addEventListener('DOMContentLoaded',function(){setTimeout(pollSupNotify,1500);setInterval(pollSupNotify,20000);});
    })();
    </script>
</body>

</html>
